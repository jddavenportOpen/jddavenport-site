<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og-card source</title>
<!--
  Source for images/og-image.png. Render with:
      python3.12 tools/render-og.py
  Tokens are copied from index.html's dusk progression (warm white to peach,
  night edge, electric blue, sunset text). If the site palette changes,
  change it here and re-render.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1A2236; --blue:#0358F7; --sun:#A3481F; --coral:#FF8A5C;
  --night:#0D1B2E; --night-ink:#F7F0E8; --night-muted:#A8B2CA; --night-sun:#FFA27A;
  --f-serif:"Newsreader",Georgia,serif; --f-sans:"Geist",system-ui,sans-serif; --f-mono:"Geist Mono",ui-monospace,monospace;
}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:linear-gradient(180deg,#FFFBF6 0,#FFF0E3 45%,#FFDDBF 100%);color:var(--ink);font-family:var(--f-sans);-webkit-font-smoothing:antialiased;position:relative}
.top{position:absolute;left:72px;right:72px;top:46px;display:flex;align-items:center;gap:14px;font:500 26px/1.2 var(--f-sans);color:var(--ink)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--coral);flex:0 0 auto}
.top b{font-weight:600}
.top span.role{color:var(--blue);font-weight:600}
h1{position:absolute;left:72px;right:72px;top:146px;font:400 88px/1.04 var(--f-serif);letter-spacing:-.024em;color:var(--ink);max-width:1040px}
.band{position:absolute;left:0;right:0;bottom:0;height:178px;background:var(--night);display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0 72px;align-items:center;border-top:6px solid var(--blue)}
.stat + .stat{padding-left:48px;border-left:1px solid rgba(247,240,232,.2)}
.num{font:400 52px/1.05 var(--f-serif);color:var(--night-ink);letter-spacing:-.015em;white-space:nowrap}
.num i{font-style:normal;color:var(--night-sun);padding:0 6px}
.src{font:600 20px/1.3 var(--f-mono);color:var(--night-muted);letter-spacing:.06em;text-transform:uppercase;margin-top:12px}
</style>
</head>
<body>
  <div class="top"><span class="dot"></span><span><b>JD Davenport</b> &middot; Founder &amp; Managing Director, <span class="role">BYU AI Foundry</span></span></div>
  <h1>I get AI out of the demo and into daily use.</h1>
  <div class="band">
    <div class="stat"><div class="num">$2M<i>&rarr;</i>$20M+</div><div class="src">National Grid</div></div>
    <div class="stat"><div class="num">3%<i>&rarr;</i>65% adoption</div><div class="src">Spark AI &middot; Siemens, summer 2026</div></div>
  </div>
</body>
</html>
